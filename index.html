<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shopping List">
<link rel="manifest" href="manifest.json">
<title>Shopping List</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f7f6;color:#17211f}.container{max-width:900px;margin:auto;padding:12px 10px 30px}.header{background:#0f766e;color:white;border-radius:18px;padding:18px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.header h1{margin:0;font-size:27px}.header p{margin:5px 0 0;font-size:14px;opacity:.92}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.card{background:white;border-radius:14px;padding:11px 10px;border:1px solid #dfe9e7;box-shadow:0 2px 8px rgba(0,0,0,.04);min-width:0}.card label{display:block;font-size:13px;color:#63706d;margin-bottom:5px;line-height:1.2}.card input{width:100%;border:0;outline:0;font-size:20px;font-weight:700;background:transparent;color:#17211f;padding:0}.total input{color:#0f766e}.average input{color:#7c3aed}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}button{border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}.add{background:#0f766e;color:white}.backup{background:#2563eb;color:white}.restore{background:#475569;color:white}.clear{background:#dc2626;color:white}.table-wrap{background:white;border-radius:16px;border:1px solid #dfe9e7;overflow-x:auto;box-shadow:0 2px 10px rgba(0,0,0,.04)}table{width:100%;min-width:720px;border-collapse:collapse}th{background:#e8f2f0;color:#30413d;font-size:13px;padding:10px 7px;text-align:left;white-space:nowrap}td{border-top:1px solid #edf1f0;padding:7px}td input{width:100%;min-height:42px;border:1px solid #ccd8d5;border-radius:9px;padding:8px;font-size:15px;background:white}td.amount{font-weight:700;color:#0f766e;white-space:nowrap}.remove{background:#fee2e2;color:#b91c1c;padding:8px 10px}.note{font-size:12px;color:#687571;margin-top:10px;line-height:1.5}@media(max-width:650px){.container{padding:10px 8px 24px}.summary{grid-template-columns:repeat(3,1fr);gap:6px}.card{padding:10px 7px;border-radius:12px}.card label{font-size:11px}.card input{font-size:17px}button{flex:1;min-width:130px}.header h1{font-size:24px}.header p{font-size:13px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>Shopping List</h1><p>Event shopping list and automatic cost calculator</p></div>
<div class="summary">
<div class="card"><label>Members / People</label><input id="members" type="number" min="1" inputmode="numeric" placeholder="20"></div>
<div class="card total"><label>Total Cost (৳)</label><input id="grandTotal" type="text" readonly value="0"></div>
<div class="card average"><label>Average per Person (৳)</label><input id="average" type="text" readonly value="0"></div>
</div>
<div class="toolbar"><button class="add" id="addBtn">＋ আইটেম যোগ করুন</button><button class="backup" id="backupBtn">💾 ব্যাকআপ</button><button class="restore" id="restoreBtn">📂 রিস্টোর</button><button class="clear" id="clearBtn">🗑 পরিষ্কার</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div>
<div class="table-wrap"><table><thead><tr><th>আইটেম</th><th>পরিমাণ</th><th>একক</th><th>দর (৳)</th><th>মোট (৳)</th><th>বাদ দিন</th></tr></thead><tbody id="itemsBody"></tbody></table></div>
<div class="note">তালিকা থেকে আইটেম নির্বাচন করুন অথবা নতুন আইটেমের নাম লিখুন। নতুন আইটেম ও তার একক স্বয়ংক্রিয়ভাবে মনে রাখা হবে এবং বাংলা বর্ণানুক্রমে সাজানো হবে।</div>
</div>
<script>
const DATA_KEY="shoppingListDataV1",ITEMS_KEY="shoppingListItemsV1";
const defaultItems=[['চাল','কেজি'],['ডাল','কেজি'],['তেল','লিটার'],['লবণ','কেজি'],['আলু','কেজি'],['পেঁয়াজ','কেজি'],['রসুন','কেজি'],['আদা','কেজি'],['মুরগি','কেজি'],['মাছ','কেজি'],['ডিম','পিস'],['শাকসবজি','কেজি'],['মসলা','কেজি'],['পানি','লিটার'],['কোমল পানীয়','লিটার'],['চিনি','কেজি'],['দুধ','লিটার'],['চা','কেজি'],['অন্যান্য','পিস']];
const oldMap={'Rice':['চাল','কেজি'],'Lentil':['ডাল','কেজি'],'Oil':['তেল','লিটার'],'Salt':['লবণ','কেজি'],'Potato':['আলু','কেজি'],'Onion':['পেঁয়াজ','কেজি'],'Garlic':['রসুন','কেজি'],'Ginger':['আদা','কেজি'],'Chicken':['মুরগি','কেজি'],'Fish':['মাছ','কেজি'],'Egg':['ডিম','পিস'],'Vegetables':['শাকসবজি','কেজি'],'Spice':['মসলা','কেজি'],'Water':['পানি','লিটার'],'Soft Drink':['কোমল পানীয়','লিটার'],'Sugar':['চিনি','কেজি'],'Milk':['দুধ','লিটার'],'Tea':['চা','কেজি'],'Other':['অন্যান্য','পিস'],'Beef':null};
function sortItems(){itemMaster.sort((a,b)=>a.name.localeCompare(b.name,'bn',{sensitivity:'base'}));}
function loadItems(){try{const saved=JSON.parse(localStorage.getItem(ITEMS_KEY));if(Array.isArray(saved)&&saved.length){const converted=[];saved.forEach(x=>{if(!x||!x.name)return;const key=String(x.name).trim();if(oldMap.hasOwnProperty(key)){if(oldMap[key])converted.push({name:oldMap[key][0],unit:oldMap[key][1]});}else{converted.push({name:key,unit:x.unit||'পিস'});}});const unique=[];const seen=new Set();converted.forEach(x=>{const k=x.name.toLowerCase();if(!seen.has(k)){seen.add(k);unique.push(x)}});itemMaster=unique;sortItems();saveItems();return itemMaster;}}catch(e){}return defaultItems.map(x=>({name:x[0],unit:x[1]}));}
let itemMaster=loadItems(),rows=[];
function saveItems(){sortItems();localStorage.setItem(ITEMS_KEY,JSON.stringify(itemMaster));}
function loadData(){try{const saved=JSON.parse(localStorage.getItem(DATA_KEY));if(saved&&Array.isArray(saved.rows)){document.getElementById('members').value=saved.members||'';rows=saved.rows.map(r=>({item:r.item||'',qty:r.qty??'',unit:r.unit||'',rate:r.rate??''}));return;}}catch(e){}rows=[{item:'',qty:'',unit:'',rate:''}];}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify({version:1,savedAt:new Date().toISOString(),members:document.getElementById('members').value,rows}));}
function money(v){return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function render(){const body=document.getElementById('itemsBody');body.innerHTML='';rows.forEach((row,index)=>{const tr=document.createElement('tr');
const itemTd=document.createElement('td'),item=document.createElement('input');item.setAttribute('list','itemList');item.placeholder='আইটেম লিখুন';item.value=row.item||'';item.addEventListener('input',()=>{rows[index].item=item.value;saveData()});item.addEventListener('change',()=>itemChanged(index,item.value));itemTd.appendChild(item);
const qtyTd=document.createElement('td'),qty=document.createElement('input');qty.type='number';qty.min='0';qty.step='any';qty.inputMode='decimal';qty.placeholder='0';qty.value=row.qty??'';qty.addEventListener('input',()=>{rows[index].qty=qty.value;saveData();recalc()});qtyTd.appendChild(qty);
const unitTd=document.createElement('td'),unit=document.createElement('input');unit.value=row.unit||'';unit.placeholder='কেজি / লিটার / পিস';unit.addEventListener('input',()=>{rows[index].unit=unit.value;saveData()});unitTd.appendChild(unit);
const rateTd=document.createElement('td'),rate=document.createElement('input');rate.type='number';rate.min='0';rate.step='any';rate.inputMode='decimal';rate.placeholder='0';rate.value=row.rate??'';rate.addEventListener('input',()=>{rows[index].rate=rate.value;saveData();recalc()});rateTd.appendChild(rate);
const amountTd=document.createElement('td');amountTd.className='amount';amountTd.id='amount-'+index;
const removeTd=document.createElement('td'),remove=document.createElement('button');remove.className='remove';remove.textContent='✕';remove.title='বাদ দিন';remove.addEventListener('click',()=>removeRow(index));removeTd.appendChild(remove);tr.append(itemTd,qtyTd,unitTd,rateTd,amountTd,removeTd);body.appendChild(tr);});
const oldList=document.getElementById('itemList');if(oldList)oldList.remove();const dl=document.createElement('datalist');dl.id='itemList';sortItems();itemMaster.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.label=x.name+' — '+x.unit;dl.appendChild(o)});document.body.appendChild(dl);recalc();}
function itemChanged(index,value){rows[index].item=value;const found=itemMaster.find(x=>x.name.toLowerCase()===value.trim().toLowerCase());if(found){rows[index].unit=found.unit}else if(value.trim()){if(!itemMaster.some(x=>x.name.toLowerCase()===value.trim().toLowerCase())){itemMaster.push({name:value.trim(),unit:rows[index].unit||'পিস'});saveItems();}}saveData();render();}
function addRow(){rows.push({item:'',qty:'',unit:'',rate:''});saveData();render();setTimeout(()=>{const input=document.querySelector('#itemsBody tr:last-child input');if(input)input.focus()},50)}
function removeRow(index){rows.splice(index,1);if(!rows.length)rows.push({item:'',qty:'',unit:'',rate:''});saveData();render()}
function recalc(){let total=0;rows.forEach((r,i)=>{const amount=(Number(r.qty)||0)*(Number(r.rate)||0);total+=amount;const el=document.getElementById('amount-'+i);if(el)el.textContent='৳ '+money(amount)});document.getElementById('grandTotal').value=money(total);const members=Number(document.getElementById('members').value)||0;document.getElementById('average').value=members>0?money(total/members):'0'}
document.getElementById('members').addEventListener('input',()=>{saveData();recalc()});document.getElementById('addBtn').addEventListener('click',addRow);
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('আপনি কি এই Shopping List পরিষ্কার করতে চান?')){rows=[{item:'',qty:'',unit:'',rate:''}];document.getElementById('members').value='';saveData();render()}});
document.getElementById('backupBtn').addEventListener('click',()=>{saveData();const backup={app:'Shopping List',version:1,exportedAt:new Date().toISOString(),itemMaster,data:JSON.parse(localStorage.getItem(DATA_KEY))};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a'),date=new Date();link.href=url;link.download='Shopping-List-Backup-'+date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')+'.json';link.click();URL.revokeObjectURL(url)});
document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const backup=JSON.parse(reader.result);if(!backup.data||!Array.isArray(backup.data.rows))throw new Error();if(confirm('এই ব্যাকআপ Restore করবেন? বর্তমান তালিকা পরিবর্তিত হবে।')){if(Array.isArray(backup.itemMaster)&&backup.itemMaster.length){itemMaster=backup.itemMaster.filter(x=>x&&x.name&&String(x.name).toLowerCase()!=='beef');itemMaster=itemMaster.map(x=>oldMap[x.name]?{name:oldMap[x.name][0],unit:oldMap[x.name][1]}:{name:x.name,unit:x.unit||'পিস'});saveItems()}localStorage.setItem(DATA_KEY,JSON.stringify(backup.data));loadData();render();alert('Backup restored successfully.')}}catch(e){alert('এটি সঠিক Shopping List backup file নয়.')}event.target.value=''};reader.readAsText(file)});
loadData();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
</html>
