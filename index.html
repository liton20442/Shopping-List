<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0f766e">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shopping List">

<link rel="manifest" href="./manifest.json">

<title>Shopping List</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f7f6;
  color:#17312d;
  font-size:16px;
}

.page{
  max-width:900px;
  margin:auto;
  padding:14px;
}

h1{
  font-size:27px;
  margin:4px 0 16px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.summary-item{
  background:#e8f5f2;
  border-radius:10px;
  padding:11px;
  text-align:center;
}

.summary-item span{
  display:block;
  font-size:14px;
}

.summary-item strong{
  display:block;
  font-size:19px;
  margin-top:5px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  cursor:pointer;
  background:#0f766e;
  color:white;
  font-size:15px;
}

button.secondary{
  background:#64748b;
}

button.danger{
  background:#dc2626;
}

button.light{
  background:#e2e8f0;
  color:#17312d;
}

input{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:7px;
  padding:9px 8px;
  background:#fff;
  font-size:16px;
}

.people{
  max-width:180px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,
td{
  border:1px solid #d8e2df;
  padding:9px 7px;
  text-align:left;
}

th{
  background:#e7f3f0;
  font-size:16px;
}

td{
  font-size:16px;
}

.main-table{
  width:100%;
  min-width:790px;
  table-layout:fixed;
}

.main-table th:nth-child(1),
.main-table td:nth-child(1){
  width:24%;
}

.main-table th:nth-child(2),
.main-table td:nth-child(2){
  width:16%;
}

.main-table th:nth-child(3),
.main-table td:nth-child(3){
  width:10%;
}

.main-table th:nth-child(4),
.main-table td:nth-child(4){
  width:10%;
}

.main-table th:nth-child(5),
.main-table td:nth-child(5){
  width:14%;
}

.main-table th:nth-child(6),
.main-table td:nth-child(6){
  width:17%;
}

.main-table th:nth-child(7),
.main-table td:nth-child(7){
  width:9%;
  text-align:center;
}

.main-table input{
  width:100%;
  padding:9px 7px;
  font-size:16px;
}

.main-table td:nth-child(6){
  white-space:nowrap;
  font-weight:600;
}

.main-table td:last-child{
  text-align:center;
}

.remove{
  background:#dc2626;
  padding:7px 10px;
  font-size:15px;
}

.total-box{
  display:flex;
  justify-content:flex-end;
  margin-top:13px;
  font-size:21px;
  font-weight:bold;
}

.view-page{
  display:none;
}

.view-header{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:13px;
}

.back{
  background:#475569;
}

.view-title{
  margin:0;
  font-size:24px;
}

.view-table{
  width:100%;
  min-width:0;
  table-layout:fixed;
}

.view-table th:nth-child(1),
.view-table td:nth-child(1){
  width:34%;
}

.view-table th:nth-child(2),
.view-table td:nth-child(2){
  width:16%;
}

.view-table th:nth-child(3),
.view-table td:nth-child(3){
  width:14%;
}

.view-table th:nth-child(4),
.view-table td:nth-child(4){
  width:17%;
}

.view-table th:nth-child(5),
.view-table td:nth-child(5){
  width:19%;
}

.view-table td,
.view-table th{
  padding:9px 6px;
  font-size:15px;
}

.view-table td:nth-child(n+2),
.view-table th:nth-child(n+2){
  white-space:nowrap;
}

.view-table td:first-child{
  overflow-wrap:anywhere;
}

.report-page{
  display:none;
}

.report-header{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:13px;
}

.report-title{
  margin:0;
  font-size:24px;
}

.report-table{
  width:100%;
  table-layout:fixed;
}

.report-table th:nth-child(1),
.report-table td:nth-child(1){
  width:60%;
}

.report-table th:nth-child(2),
.report-table td:nth-child(2){
  width:40%;
  text-align:right;
}

.report-table th,
.report-table td{
  font-size:16px;
  padding:11px 9px;
}

.report-table tfoot td{
  font-weight:bold;
  background:#e7f3f0;
}

.empty{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-size:16px;
}

@media(max-width:520px){

  .page{
    padding:10px;
  }

  h1{
    font-size:25px;
  }

  .card{
    padding:12px;
  }

  .summary{
    gap:6px;
  }

  .summary-item{
    padding:9px 5px;
  }

  .summary-item span{
    font-size:12px;
  }

  .summary-item strong{
    font-size:17px;
  }

  .actions button{
    flex:1 1 30%;
    padding:10px 7px;
    font-size:14px;
  }

  .main-table{
    min-width:790px;
  }

  .main-table th{
    font-size:15px;
    padding:9px 6px;
  }

  .main-table td{
    font-size:16px;
    padding:8px 5px;
  }

  .main-table input{
    font-size:16px;
    padding:9px 6px;
  }

  .view-title{
    font-size:21px;
  }

  .view-table th,
  .view-table td{
    font-size:15px;
    padding:9px 5px;
  }

  .report-title{
    font-size:21px;
  }

  .report-table th,
  .report-table td{
    font-size:15px;
    padding:10px 7px;
  }

  .total-box{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- MAIN PAGE -->
  <div id="mainPage">

    <h1>Shopping List</h1>

    <div class="card summary">

      <div class="summary-item">
        <span>Members / People</span>
        <strong id="memberCount">1</strong>
      </div>

      <div class="summary-item">
        <span>Total Cost (৳)</span>
        <strong id="totalCost">0</strong>
      </div>

      <div class="summary-item">
        <span>Average per Person (৳)</span>
        <strong id="averageCost">0</strong>
      </div>

    </div>

    <div class="card">

      <label>
        <strong>Number of People</strong>
      </label>

      <input
        id="members"
        class="people"
        type="text"
        value="1"
      >

    </div>

    <div class="card actions">

      <button onclick="addRow()">+ Add Item</button>

      <button
        class="secondary"
        onclick="showView()">
        View
      </button>

      <button
        class="secondary"
        onclick="showReport()">
        📊 Report
      </button>

      <button
        class="light"
        onclick="backupData()">
        Backup
      </button>

      <button
        class="light"
        onclick="document.getElementById('restoreFile').click()">
        Restore
      </button>

      <button
        class="danger"
        onclick="clearAll()">
        Clear
      </button>

      <input
        type="file"
        id="restoreFile"
        accept=".json"
        style="display:none"
        onchange="restoreData(event)"
      >

    </div>

    <div class="card table-wrap">

      <table class="main-table">

        <thead>

          <tr>
            <th>আইটেম</th>
            <th>ক্যাটাগরি</th>
            <th>পরিমাণ</th>
            <th>একক</th>
            <th>দর (৳)</th>
            <th>মোট (৳)</th>
            <th>বাদ দিন</th>
          </tr>

        </thead>

        <tbody id="tableBody"></tbody>

      </table>

      <div class="total-box">
        সর্বমোট&nbsp; ৳ <span id="grandTotal">0</span>
      </div>

    </div>

  </div>


  <!-- VIEW PAGE -->
  <div id="viewPage" class="view-page">

    <div class="view-header">

      <button
        class="back"
        onclick="showMain()">
        ← Back
      </button>

      <h2 class="view-title">
        Total Shopping List
      </h2>

    </div>

    <div class="card table-wrap">

      <table class="view-table">

        <thead>

          <tr>
            <th>আইটেম</th>
            <th>পরিমাণ</th>
            <th>একক</th>
            <th>দর (৳)</th>
            <th>মোট (৳)</th>
          </tr>

        </thead>

        <tbody id="viewBody"></tbody>

        <tfoot>

          <tr>
            <td colspan="4">
              সর্বমোট
            </td>

            <td id="viewTotal">
              0
            </td>
          </tr>

        </tfoot>

      </table>

    </div>

  </div>


  <!-- REPORT PAGE -->
  <div id="reportPage" class="report-page">

    <div class="report-header">

      <button
        class="back"
        onclick="showMain()">
        ← Back
      </button>

      <h2 class="report-title">
        খরচের ক্যাটাগরি রিপোর্ট
      </h2>

    </div>

    <div class="card table-wrap">

      <table class="report-table">

        <thead>

          <tr>
            <th>ক্যাটাগরি</th>
            <th>মোট খরচ (৳)</th>
          </tr>

        </thead>

        <tbody id="reportBody"></tbody>

        <tfoot>

          <tr>
            <td>সর্বমোট</td>
            <td id="reportTotal">0</td>
          </tr>

        </tfoot>

      </table>

    </div>

  </div>

</div>


<!-- Category dropdown only -->
<datalist id="categoryList"></datalist>


<script>

const DATA_KEY = "shoppingListDataV2";
const ITEMS_KEY = "shoppingListItemsV3";
const CATEGORY_KEY = "shoppingListCategoriesV1";

const DEFAULT_CATEGORIES = [
  "খাবার",
  "ডেকোরেটর",
  "অন্যান্য"
];



/* =========================
   LOAD DATA
========================= */

let saved = loadData();

let itemMaster = loadItems();

let categoryMaster = loadCategories();

let rows = saved.rows;

let members = saved.members;



/* =========================
   NUMBER FUNCTIONS
========================= */

function normalizeNumber(v){

  return String(v ?? "")
    .replace(
      /[০-৯]/g,
      d => "০১২৩৪৫৬৭৮৯".indexOf(d)
    )
    .replace(
      /[٠-٩]/g,
      d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)
    )
    .replace(/,/g,"")
    .trim();

}


function num(v){

  let n = parseFloat(
    normalizeNumber(v)
  );

  return Number.isFinite(n) ? n : 0;

}


function money(v){

  return Number(v || 0)
    .toLocaleString(
      "bn-BD",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}



/* =========================
   ITEM STORAGE
========================= */

function sortItems(a){

  return [...a].sort(
    (x,y) =>
      String(x.name || "")
      .localeCompare(
        String(y.name || ""),
        "bn"
      )
  );

}


function loadItems(){

  try{

    let data =
      JSON.parse(
        localStorage.getItem(ITEMS_KEY)
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    return [];

  }

}


function saveItems(){

  localStorage.setItem(
    ITEMS_KEY,
    JSON.stringify(itemMaster)
  );

}


/*
  Item dropdown has been removed.
  This function is kept only so old saved
  item data remains compatible with Backup/Restore.
*/

function updateList(){

  let d =
    document.getElementById("itemList");

  if(!d) return;

  d.innerHTML = "";

  sortItems(itemMaster).forEach(x => {

    let o =
      document.createElement("option");

    o.value = x.name;

    d.appendChild(o);

  });

}



/* =========================
   CATEGORY STORAGE
========================= */

function sortCategories(a){

  return [...a].sort(
    (x,y) =>
      String(x).localeCompare(
        String(y),
        "bn"
      )
  );

}


function loadCategories(){

  try{

    let data =
      JSON.parse(
        localStorage.getItem(CATEGORY_KEY)
      );

    if(Array.isArray(data) && data.length){

      return data;

    }

  }catch(e){}

  return [...DEFAULT_CATEGORIES];

}


function saveCategories(){

  localStorage.setItem(
    CATEGORY_KEY,
    JSON.stringify(categoryMaster)
  );

}


function updateCategoryList(){

  let d =
    document.getElementById("categoryList");

  if(!d) return;

  d.innerHTML = "";

  sortCategories(categoryMaster)
    .forEach(x => {

      let o =
        document.createElement("option");

      o.value = x;

      d.appendChild(o);

    });

}



/* =========================
   MAIN DATA
========================= */

function loadData(){

  try{

    let data =
      JSON.parse(
        localStorage.getItem(DATA_KEY)
      );

    if(data && Array.isArray(data.rows)){

      return {

        rows:data.rows.map(r => ({
          item:r.item || "",
          category:r.category || "",
          qty:r.qty || "",
          unit:r.unit || "",
          rate:r.rate || ""
        })),

        members:
          Number(data.members) || 1

      };

    }

  }catch(e){}

  return {

    rows:[],

    members:1

  };

}


function saveData(){

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify({
      rows:rows,
      members:members
    })
  );

}



/* =========================
   ITEM SAVE
========================= */

function saveNewItem(i){

  let name =
    String(rows[i].item || "").trim();

  if(!name) return;

  let exists =
    itemMaster.some(
      x =>
        String(x.name).toLowerCase()
        === name.toLowerCase()
    );

  if(!exists){

    itemMaster.push({
      name:name
    });

    saveItems();

  }

}


/* =========================
   CATEGORY SAVE
========================= */

function saveNewCategory(i){

  let category =
    String(rows[i].category || "").trim();

  if(!category) return;

  let exists =
    categoryMaster.some(
      x =>
        String(x).toLowerCase()
        === category.toLowerCase()
    );

  if(!exists){

    categoryMaster.push(category);

    saveCategories();

    updateCategoryList();

  }

}



/* =========================
   ADD ROW
========================= */

function addRow(){

  rows.push({

    item:"",
    category:"",
    qty:"",
    unit:"",
    rate:""

  });

  saveData();

  render();

  setTimeout(() => {

    focusCell(
      rows.length - 1,
      0
    );

  },50);

}



/* =========================
   REMOVE ROW
========================= */

function removeRow(i){

  rows.splice(i,1);

  saveData();

  render();

}



/* =========================
   UPDATE ROW TOTAL
========================= */

function updateRowTotal(i){

  let total =
    num(rows[i].qty)
    *
    num(rows[i].rate);

  let el =
    document.getElementById(
      "rowTotal-" + i
    );

  if(el){

    el.textContent =
      money(total);

  }

}



/* =========================
   RECALCULATE
========================= */

function recalc(){

  let total = 0;

  rows.forEach(r => {

    total +=
      num(r.qty)
      *
      num(r.rate);

  });

  let personCount =
    num(
      document.getElementById("members").value
    );

  if(personCount < 1){

    personCount = 1;

  }

  members = personCount;

  document.getElementById(
    "memberCount"
  ).textContent = money(members);

  document.getElementById(
    "totalCost"
  ).textContent = money(total);

  document.getElementById(
    "averageCost"
  ).textContent =
    money(total / members);

  document.getElementById(
    "grandTotal"
  ).textContent = money(total);

  saveData();

}



/* =========================
   FOCUS CELL
========================= */

function focusCell(
  rowIndex,
  colIndex
){

  let tr =
    document.querySelector(
      'tr[data-row-index="' +
      rowIndex +
      '"]'
    );

  if(!tr) return;

  let input =
    tr.querySelector(
      'input[data-col-index="' +
      colIndex +
      '"]'
    );

  if(input){

    input.focus();

    try{
      input.select();
    }catch(e){}

  }

}



/* =========================
   ENTER / RETURN NAVIGATION
========================= */

function handleEnter(
  e,
  rowIndex,
  colIndex
){

  if(
    e.key !== "Enter" &&
    e.key !== "Return"
  ){

    return;

  }

  e.preventDefault();

  e.stopPropagation();

  if(colIndex < 4){

    focusCell(
      rowIndex,
      colIndex + 1
    );

  }else{

    if(rowIndex < rows.length - 1){

      focusCell(
        rowIndex + 1,
        0
      );

    }else{

      addRow();

    }

  }

}



/* =========================
   RENDER MAIN TABLE
========================= */

function render(){

  let body =
    document.getElementById(
      "tableBody"
    );

  body.innerHTML = "";

  rows.forEach((row,i) => {

    let tr =
      document.createElement("tr");

    tr.dataset.rowIndex = i;



    /* ITEM */

    let tdItem =
      document.createElement("td");

    let itemInput =
      document.createElement("input");

    itemInput.type = "text";

    /*
      IMPORTANT:
      No list attribute here.
      Therefore Item dropdown is removed.
    */

    itemInput.value =
      row.item || "";

    itemInput.dataset.colIndex = "0";

    itemInput.autocomplete = "off";

    itemInput.addEventListener(
      "input",
      () => {

        rows[i].item =
          itemInput.value;

        saveData();

      }
    );

    itemInput.addEventListener(
      "change",
      () => {

        rows[i].item =
          itemInput.value;

        saveNewItem(i);

        saveData();

      }
    );

    itemInput.addEventListener(
      "keydown",
      e =>
        handleEnter(
          e,
          i,
          0
        )
    );

    tdItem.appendChild(
      itemInput
    );



    /* CATEGORY */

    let tdCategory =
      document.createElement("td");

    let categoryInput =
      document.createElement("input");

    categoryInput.type = "text";

    categoryInput.setAttribute(
      "list",
      "categoryList"
    );

    categoryInput.value =
      row.category || "";

    categoryInput.dataset.colIndex = "1";

    categoryInput.autocomplete = "off";

    categoryInput.addEventListener(
      "input",
      () => {

        rows[i].category =
          categoryInput.value;

        saveData();

      }
    );

    categoryInput.addEventListener(
      "change",
      () => {

        rows[i].category =
          categoryInput.value;

        saveNewCategory(i);

        saveData();

      }
    );

    categoryInput.addEventListener(
      "blur",
      () => {

        rows[i].category =
          categoryInput.value;

        saveNewCategory(i);

        saveData();

      }
    );

    categoryInput.addEventListener(
      "keydown",
      e =>
        handleEnter(
          e,
          i,
          1
        )
    );

    tdCategory.appendChild(
      categoryInput
    );



    /* QUANTITY */

    let tdQty =
      document.createElement("td");

    let qtyInput =
      document.createElement("input");

    qtyInput.type = "text";

    qtyInput.value =
      row.qty || "";

    qtyInput.dataset.colIndex = "2";

    qtyInput.autocomplete = "off";

    qtyInput.addEventListener(
      "input",
      () => {

        rows[i].qty =
          qtyInput.value;

        updateRowTotal(i);

        recalc();

      }
    );

    qtyInput.addEventListener(
      "keydown",
      e =>
        handleEnter(
          e,
          i,
          2
        )
    );

    tdQty.appendChild(
      qtyInput
    );



    /* UNIT */

    let tdUnit =
      document.createElement("td");

    let unitInput =
      document.createElement("input");

    unitInput.type = "text";

    unitInput.value =
      row.unit || "";

    unitInput.dataset.colIndex = "3";

    unitInput.autocomplete = "off";

    unitInput.addEventListener(
      "input",
      () => {

        rows[i].unit =
          unitInput.value;

        saveData();

      }
    );

    unitInput.addEventListener(
      "keydown",
      e =>
        handleEnter(
          e,
          i,
          3
        )
    );

    tdUnit.appendChild(
      unitInput
    );



    /* RATE */

    let tdRate =
      document.createElement("td");

    let rateInput =
      document.createElement("input");

    rateInput.type = "text";

    rateInput.value =
      row.rate || "";

    rateInput.dataset.colIndex = "4";

    rateInput.autocomplete = "off";

    rateInput.addEventListener(
      "input",
      () => {

        rows[i].rate =
          rateInput.value;

        updateRowTotal(i);

        recalc();

      }
    );

    rateInput.addEventListener(
      "keydown",
      e =>
        handleEnter(
          e,
          i,
          4
        )
    );

    tdRate.appendChild(
      rateInput
    );



    /* TOTAL */

    let tdTotal =
      document.createElement("td");

    tdTotal.id =
      "rowTotal-" + i;

    tdTotal.textContent =
      money(
        num(row.qty)
        *
        num(row.rate)
      );



    /* REMOVE */

    let tdRemove =
      document.createElement("td");

    let removeButton =
      document.createElement("button");

    removeButton.className =
      "remove";

    removeButton.textContent =
      "×";

    removeButton.title =
      "বাদ দিন";

    removeButton.onclick =
      () => removeRow(i);

    tdRemove.appendChild(
      removeButton
    );



    tr.appendChild(tdItem);
    tr.appendChild(tdCategory);
    tr.appendChild(tdQty);
    tr.appendChild(tdUnit);
    tr.appendChild(tdRate);
    tr.appendChild(tdTotal);
    tr.appendChild(tdRemove);

    body.appendChild(tr);

  });


  /*
    Item dropdown no longer exists.
    Category dropdown is still updated.
  */

  updateCategoryList();

  recalc();

}



/* =========================
   VIEW PAGE
========================= */

function showView(){

  document.getElementById(
    "mainPage"
  ).style.display = "none";

  document.getElementById(
    "reportPage"
  ).style.display = "none";

  document.getElementById(
    "viewPage"
  ).style.display = "block";

  renderView();

}


function renderView(){

  let body =
    document.getElementById(
      "viewBody"
    );

  body.innerHTML = "";

  let total = 0;

  let validRows =
    rows.filter(
      r =>
        String(r.item || "").trim() ||
        num(r.qty) ||
        num(r.rate)
    );

  if(validRows.length === 0){

    let tr =
      document.createElement("tr");

    let td =
      document.createElement("td");

    td.colSpan = 5;

    td.className = "empty";

    td.textContent =
      "কোনো Shopping List নেই";

    tr.appendChild(td);

    body.appendChild(tr);

  }else{

    validRows.forEach(r => {

      let rowTotal =
        num(r.qty)
        *
        num(r.rate);

      total += rowTotal;

      let tr =
        document.createElement("tr");

      let values = [

        r.item || "",

        r.qty || "",

        r.unit || "",

        money(num(r.rate)),

        money(rowTotal)

      ];

      values.forEach(value => {

        let td =
          document.createElement("td");

        td.textContent = value;

        tr.appendChild(td);

      });

      body.appendChild(tr);

    });

  }

  document.getElementById(
    "viewTotal"
  ).textContent =
    money(total);

}



/* =========================
   REPORT PAGE
========================= */

function showReport(){

  document.getElementById(
    "mainPage"
  ).style.display = "none";

  document.getElementById(
    "viewPage"
  ).style.display = "none";

  document.getElementById(
    "reportPage"
  ).style.display = "block";

  renderReport();

}


function renderReport(){

  let totals = {};

  let grandTotal = 0;

  rows.forEach(r => {

    let amount =
      num(r.qty)
      *
      num(r.rate);

    if(amount <= 0) return;

    let category =
      String(
        r.category || ""
      ).trim();

    if(!category){

      category = "অন্যান্য";

    }

    if(!totals[category]){

      totals[category] = 0;

    }

    totals[category] += amount;

    grandTotal += amount;

  });


  let body =
    document.getElementById(
      "reportBody"
    );

  body.innerHTML = "";


  let categories =
    Object.keys(totals)
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            "bn"
          )
      );


  if(categories.length === 0){

    let tr =
      document.createElement("tr");

    let td =
      document.createElement("td");

    td.colSpan = 2;

    td.className = "empty";

    td.textContent =
      "কোনো খরচের তথ্য নেই";

    tr.appendChild(td);

    body.appendChild(tr);

  }else{

    categories.forEach(category => {

      let tr =
        document.createElement("tr");

      let tdName =
        document.createElement("td");

      tdName.textContent =
        category;

      let tdAmount =
        document.createElement("td");

      tdAmount.textContent =
        money(
          totals[category]
        );

      tr.appendChild(tdName);

      tr.appendChild(tdAmount);

      body.appendChild(tr);

    });

  }


  document.getElementById(
    "reportTotal"
  ).textContent =
    money(grandTotal);

}



/* =========================
   BACK TO MAIN
========================= */

function showMain(){

  document.getElementById(
    "viewPage"
  ).style.display = "none";

  document.getElementById(
    "reportPage"
  ).style.display = "none";

  document.getElementById(
    "mainPage"
  ).style.display = "block";

}



/* =========================
   BACKUP
========================= */

function backupData(){

  let backup = {

    app:"Shopping List",

    version:4,

    exportedAt:
      new Date().toISOString(),

    itemMaster:itemMaster,

    categoryMaster:categoryMaster,

    data:{

      members:members,

      rows:rows

    }

  };


  let blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  let url =
    URL.createObjectURL(blob);

  let a =
    document.createElement("a");

  let date =
    new Date()
      .toISOString()
      .slice(0,10);

  a.href = url;

  a.download =
    "Shopping-List-Backup-" +
    date +
    ".json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}



/* =========================
   RESTORE
========================= */

function restoreData(event){

  let file =
    event.target.files[0];

  if(!file) return;


  let reader =
    new FileReader();


  reader.onload =
    function(){

      try{

        let backup =
          JSON.parse(
            reader.result
          );


        if(
          !backup ||
          !backup.data ||
          !Array.isArray(
            backup.data.rows
          )
        ){

          alert(
            "Backup file সঠিক নয়।"
          );

          return;

        }


        rows =
          backup.data.rows.map(
            r => ({

              item:r.item || "",

              category:
                r.category || "",

              qty:r.qty || "",

              unit:r.unit || "",

              rate:r.rate || ""

            })
          );


        members =
          Number(
            backup.data.members
          ) || 1;


        if(
          Array.isArray(
            backup.itemMaster
          )
        ){

          itemMaster =
            backup.itemMaster;

        }


        if(
          Array.isArray(
            backup.categoryMaster
          )
        ){

          categoryMaster =
            backup.categoryMaster;

        }


        document.getElementById(
          "members"
        ).value = members;


        saveItems();

        saveCategories();

        saveData();

        render();


        alert(
          "Backup সফলভাবে Restore হয়েছে।"
        );


      }catch(e){

        alert(
          "Backup file পড়তে সমস্যা হয়েছে।"
        );

      }

    };


  reader.readAsText(file);


  event.target.value = "";

}



/* =========================
   CLEAR ALL
========================= */

function clearAll(){

  let ok =
    confirm(
      "সব Shopping List, Item এবং Category-এর সংরক্ষিত ডাটা মুছে ফেলতে চান?"
    );

  if(!ok) return;


  rows = [];

  members = 1;

  itemMaster = [];

  categoryMaster =
    [...DEFAULT_CATEGORIES];


  document.getElementById(
    "members"
  ).value = "1";


  localStorage.removeItem(
    ITEMS_KEY
  );

  localStorage.removeItem(
    CATEGORY_KEY
  );


  saveData();

  render();

}
