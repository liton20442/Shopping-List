<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shopping List">
<link rel="manifest" href="./manifest.json">
<title>Shopping List</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f7f6;
  color:#17312d;
  font-size:16px
}
.page{max-width:900px;margin:auto;padding:14px}
h1{font-size:27px;margin:4px 0 16px}
.card{
  background:#fff;border-radius:14px;padding:15px;margin-bottom:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.summary-item{
  background:#e8f5f2;border-radius:10px;padding:11px;text-align:center
}
.summary-item span{display:block;font-size:14px}
.summary-item strong{display:block;font-size:19px;margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:9px}
button{
  border:0;border-radius:9px;padding:11px 14px;cursor:pointer;
  background:#0f766e;color:white;font-size:15px
}
button.secondary{background:#64748b}
button.danger{background:#dc2626}
button.light{background:#e2e8f0;color:#17312d}
input{
  width:100%;border:1px solid #cbd5e1;border-radius:7px;
  padding:9px 8px;background:#fff;font-size:16px
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #d8e2df;padding:9px 7px;text-align:left}
th{background:#e7f3f0;font-size:16px}
td{font-size:16px}
.main-table{width:100%;min-width:790px;table-layout:fixed}
.main-table th:nth-child(1),.main-table td:nth-child(1){width:10%}
.main-table th:nth-child(2),.main-table td:nth-child(2){width:16%}
.main-table th:nth-child(3),.main-table td:nth-child(3){width:10%}
.main-table th:nth-child(4),.main-table td:nth-child(4){width:10%}
.main-table th:nth-child(5),.main-table td:nth-child(5){width:14%}
.main-table th:nth-child(6),.main-table td:nth-child(6){width:17%}
.main-table th:nth-child(7),.main-table td:nth-child(7){width:9%;text-align:center}
.main-table input{width:100%;padding:9px 7px;font-size:16px}
.main-table td:nth-child(6){white-space:nowrap;font-weight:600}
.main-table td:last-child{text-align:center}
.remove{background:#dc2626;padding:7px 10px;font-size:15px}
.total-box{
  display:flex;justify-content:flex-end;margin-top:13px;
  font-size:21px;font-weight:bold
}
.view-page,.report-page{display:none}
.view-header,.report-header{
  display:flex;align-items:center;gap:11px;margin-bottom:13px
}
.back{background:#475569}
.view-title,.report-title{margin:0;font-size:24px}
.view-table{width:100%;min-width:0;table-layout:fixed}
.view-table th:nth-child(1),.view-table td:nth-child(1){width:20%}
.view-table th:nth-child(2),.view-table td:nth-child(2){width:16%}
.view-table th:nth-child(3),.view-table td:nth-child(3){width:14%}
.view-table th:nth-child(4),.view-table td:nth-child(4){width:17%}
.view-table th:nth-child(5),.view-table td:nth-child(5){width:19%}
.view-table td,.view-table th{padding:9px 6px;font-size:15px}
.view-table td:nth-child(n+2),.view-table th:nth-child(n+2){white-space:nowrap}
.view-table td:first-child{overflow-wrap:anywhere}
.report-table{width:100%;table-layout:fixed}
.report-table th:nth-child(1),.report-table td:nth-child(1){width:60%}
.report-table th:nth-child(2),.report-table td:nth-child(2){
  width:40%;text-align:right
}
.report-table th,.report-table td{font-size:16px;padding:11px 9px}
.report-table tfoot td{font-weight:bold;background:#e7f3f0}
.empty{text-align:center;padding:20px;color:#64748b;font-size:16px}

@media(max-width:520px){
  .page{padding:10px}
  h1{font-size:25px}
  .card{padding:12px}
  .summary{gap:6px}
  .summary-item{padding:9px 5px}
  .summary-item span{font-size:12px}
  .summary-item strong{font-size:17px}
  .actions button{flex:1 1 30%;padding:10px 7px;font-size:14px}
  .main-table{min-width:790px}
  .main-table th{font-size:15px;padding:9px 6px}
  .main-table td{font-size:16px;padding:8px 5px}
  .main-table input{font-size:16px;padding:9px 6px}
  .view-title,.report-title{font-size:21px}
  .view-table th,.view-table td{font-size:15px;padding:9px 5px}
  .report-table th,.report-table td{font-size:15px;padding:10px 7px}
  .total-box{font-size:20px}
}
</style>
</head>

<body>

<div class="page">

<div id="mainPage">

<h1>Shopping List</h1>

<div class="card summary">
  <div class="summary-item">
    <span>Members / People</span>
    <strong id="memberCount">1</strong>
  </div>
  <div class="summary-item">
    <span>Total Cost (৳)</span>
    <strong id="totalCost">0</strong>
  </div>
  <div class="summary-item">
    <span>Average per Person (৳)</span>
    <strong id="averageCost">0</strong>
  </div>
</div>

<div class="card actions">
  <button onclick="addRow()">+ Add Item</button>
  <button class="secondary" onclick="showView()">View</button>
  <button class="secondary" onclick="showReport()">📊 Report</button>
  <button class="light" onclick="backupData()">Backup</button>
  <button class="light" onclick="document.getElementById('restoreFile').click()">Restore</button>
  <button class="danger" onclick="clearAll()">Clear</button>

  <input
    type="file"
    id="restoreFile"
    accept=".json"
    style="display:none"
    onchange="restoreData(event)"
  >
</div>

<div class="card table-wrap">

<table class="main-table">

<thead>
<tr>
  <th>আইটেম</th>
  <th>ক্যাটাগরি</th>
  <th>পরিমাণ</th>
  <th>একক</th>
  <th>দর</th>
  <th>মোট</th>
  <th>বাদ দিন</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<div class="total-box">
  সর্বমোট&nbsp; <span id="grandTotal">0</span>
</div>

</div>
</div>


<div id="viewPage" class="view-page">

<div class="view-header">
  <button class="back" onclick="showMain()">← Back</button>
  <h2 class="view-title">Total Shopping List</h2>
</div>

<div class="card table-wrap">

<table class="view-table">

<thead>
<tr>
  <th>আইটেম</th>
  <th>পরিমাণ</th>
  <th>একক</th>
  <th>দর</th>
  <th>মোট</th>
</tr>
</thead>

<tbody id="viewBody"></tbody>

<tfoot>
<tr>
  <td colspan="4">সর্বমোট</td>
  <td id="viewTotal">0</td>
</tr>
</tfoot>

</table>
</div>
</div>


<div id="reportPage" class="report-page">

<div class="report-header">
  <button class="back" onclick="showMain()">← Back</button>
  <h2 class="report-title">খরচের ক্যাটাগরি রিপোর্ট</h2>
</div>

<div class="card table-wrap">

<table class="report-table">

<thead>
<tr>
  <th>ক্যাটাগরি</th>
  <th>মোট খরচ</th>
</tr>
</thead>

<tbody id="reportBody"></tbody>

<tfoot>
<tr>
  <td>সর্বমোট</td>
  <td id="reportTotal">0</td>
</tr>
</tfoot>

</table>
</div>
</div>

</div>


<datalist id="categoryList">
  <option value="খাবার"></option>
  <option value="ডেকোরেটর"></option>
  <option value="অন্যান্য"></option>
</datalist>


<script>

const DATA_KEY="shoppingListDataV2";
const ITEMS_KEY="shoppingListItemsV3";
const CATEGORY_KEY="shoppingListCategoriesV1";

const DEFAULT_CATEGORIES=[
  "খাবার",
  "ডেকোরেটর",
  "অন্যান্য"
];

let saved=loadData();
let itemMaster=loadItems();
let categoryMaster=loadCategories();
let rows=saved.rows;
let members=saved.members;


/* =========================
   NUMBER
========================= */

function normalizeNumber(v){

  return String(v??"")
    .replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d))
    .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/,/g,"")
    .trim();

}

function num(v){

  const n=parseFloat(normalizeNumber(v));

  return Number.isFinite(n)?n:0;

}

function money(v){

  return Number(v||0).toLocaleString(
    "bn-BD",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}


/* =========================
   ITEMS
========================= */

function loadItems(){

  try{

    const data=JSON.parse(
      localStorage.getItem(ITEMS_KEY)
    );

    return Array.isArray(data)?data:[];

  }catch(e){

    return [];

  }

}

function saveItems(){

  localStorage.setItem(
    ITEMS_KEY,
    JSON.stringify(itemMaster)
  );

}

function saveNewItem(i){

  const name=String(
    rows[i].item||""
  ).trim();

  if(!name)return;

  const exists=itemMaster.some(
    x=>String(x.name).toLowerCase()===
       name.toLowerCase()
  );

  if(!exists){

    itemMaster.push({name:name});
    saveItems();

  }

}


/* =========================
   CATEGORY
========================= */

function loadCategories(){

  try{

    const data=JSON.parse(
      localStorage.getItem(CATEGORY_KEY)
    );

    if(Array.isArray(data)){

      return [
        ...new Set([
          ...data,
          ...DEFAULT_CATEGORIES
        ])
      ];

    }

  }catch(e){}

  return [...DEFAULT_CATEGORIES];

}

function saveCategories(){

  localStorage.setItem(
    CATEGORY_KEY,
    JSON.stringify(categoryMaster)
  );

}

function updateCategoryList(){

  const list=document.getElementById(
    "categoryList"
  );

  if(!list)return;

  list.innerHTML="";

  [
    ...new Set([
      ...DEFAULT_CATEGORIES,
      ...categoryMaster
    ])
  ]
  .sort((a,b)=>String(a).localeCompare(b,"bn"))
  .forEach(category=>{

    const option=document.createElement("option");

    option.value=category;

    list.appendChild(option);

  });

}

function saveNewCategory(i){

  const category=String(
    rows[i].category||""
  ).trim();

  if(!category)return;

  const exists=categoryMaster.some(
    x=>String(x).toLowerCase()===
       category.toLowerCase()
  );

  if(!exists){

    categoryMaster.push(category);
    saveCategories();
    updateCategoryList();

  }

}


/* =========================
   DATA
========================= */

function loadData(){

  try{

    const data=JSON.parse(
      localStorage.getItem(DATA_KEY)
    );

    if(data&&Array.isArray(data.rows)){

      return{
        rows:data.rows.map(r=>({
          item:r.item||"",
          category:r.category||"",
          qty:r.qty||"",
          unit:r.unit||"",
          rate:r.rate||""
        })),
        members:Number(data.members)||1
      };

    }

  }catch(e){}

  return{
    rows:[],
    members:1
  };

}

function saveData(){

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify({
      rows:rows,
      members:members
    })
  );

}


/* =========================
   FOCUS
========================= */

function activateInput(input){

  if(!input)return;

  input.focus();

  try{
    input.setSelectionRange(
      input.value.length,
      input.value.length
    );
  }catch(e){}

}


/* =========================
   CREATE ROW DOM
========================= */

function createRowElement(row,i){

  const tr=document.createElement("tr");

  tr.dataset.rowIndex=i;


  /* ITEM */

  const tdItem=document.createElement("td");

  const itemInput=document.createElement("input");

  itemInput.type="text";
  itemInput.value=row.item||"";
  itemInput.dataset.colIndex="0";
  itemInput.autocomplete="off";

  itemInput.addEventListener("input",()=>{

    rows[i].item=itemInput.value;
    saveData();

  });

  itemInput.addEventListener("change",()=>{

    rows[i].item=itemInput.value;
    saveNewItem(i);
    saveData();

  });

  itemInput.addEventListener("keydown",e=>{

    handleEnter(e,i,0);

  });

  tdItem.appendChild(itemInput);


  /* CATEGORY */

  const tdCategory=document.createElement("td");

  const categoryInput=document.createElement("input");

  categoryInput.type="text";
  categoryInput.setAttribute("list","categoryList");
  categoryInput.value=row.category||"";
  categoryInput.dataset.colIndex="1";
  categoryInput.autocomplete="off";

  categoryInput.addEventListener("input",()=>{

    rows[i].category=categoryInput.value;
    saveData();

  });

  categoryInput.addEventListener("change",()=>{

    rows[i].category=categoryInput.value;
    saveNewCategory(i);
    saveData();

  });

  categoryInput.addEventListener("blur",()=>{

    rows[i].category=categoryInput.value;
    saveNewCategory(i);
    saveData();

  });

  categoryInput.addEventListener("keydown",e=>{

    handleEnter(e,i,1);

  });

  tdCategory.appendChild(categoryInput);


  /* QUANTITY */

  const tdQty=document.createElement("td");

  const qtyInput=document.createElement("input");

  qtyInput.type="text";
  qtyInput.value=row.qty||"";
  qtyInput.dataset.colIndex="2";
  qtyInput.autocomplete="off";

  qtyInput.addEventListener("input",()=>{

    rows[i].qty=qtyInput.value;
    updateRowTotal(i);
    recalc();

  });

  qtyInput.addEventListener("keydown",e=>{

    handleEnter(e,i,2);

  });

  tdQty.appendChild(qtyInput);


  /* UNIT */

  const tdUnit=document.createElement("td");

  const unitInput=document.createElement("input");

  unitInput.type="text";
  unitInput.value=row.unit||"";
  unitInput.dataset.colIndex="3";
  unitInput.autocomplete="off";

  unitInput.addEventListener("input",()=>{

    rows[i].unit=unitInput.value;
    saveData();

  });

  unitInput.addEventListener("keydown",e=>{

    handleEnter(e,i,3);

  });

  tdUnit.appendChild(unitInput);


  /* RATE */

  const tdRate=document.createElement("td");

  const rateInput=document.createElement("input");

  rateInput.type="text";
  rateInput.value=row.rate||"";
  rateInput.dataset.colIndex="4";
  rateInput.autocomplete="off";

  rateInput.addEventListener("input",()=>{

    rows[i].rate=rateInput.value;
    updateRowTotal(i);
    recalc();

  });

  rateInput.addEventListener("keydown",e=>{

    handleEnter(e,i,4);

  });

  tdRate.appendChild(rateInput);


  /* TOTAL */

  const tdTotal=document.createElement("td");

  tdTotal.id="rowTotal-"+i;

  tdTotal.textContent=money(
    num(row.qty)*num(row.rate)
  );


  /* REMOVE */

  const tdRemove=document.createElement("td");

  const removeButton=document.createElement("button");

  removeButton.className="remove";
  removeButton.textContent="×";
  removeButton.title="বাদ দিন";

  removeButton.onclick=()=>{

    removeRow(i);

  };

  tdRemove.appendChild(removeButton);


  tr.appendChild(tdItem);
  tr.appendChild(tdCategory);
  tr.appendChild(tdQty);
  tr.appendChild(tdUnit);
  tr.appendChild(tdRate);
  tr.appendChild(tdTotal);
  tr.appendChild(tdRemove);

  return tr;

}


/* =========================
   RENDER
========================= */

function render(){

  const body=document.getElementById(
    "tableBody"
  );

  body.innerHTML="";

  rows.forEach((row,i)=>{

    body.appendChild(
      createRowElement(row,i)
    );

  });

  updateCategoryList();

  recalc();

}


/* =========================
   ADD ROW
   নতুন Row DOM-এ সরাসরি
   যোগ করা হচ্ছে যাতে iPhone
   keyboard focus হারায় না।
========================= */

function addRow(){

  const newIndex=rows.length;

  const newRow={
    item:"",
    category:"",
    qty:"",
    unit:"",
    rate:""
  };

  rows.push(newRow);

  const body=document.getElementById(
    "tableBody"
  );

  const tr=createRowElement(
    newRow,
    newIndex
  );

  body.appendChild(tr);

  saveData();

  recalc();

  const input=tr.querySelector(
    'input[data-col-index="0"]'
  );

  activateInput(input);

}


/* =========================
   REMOVE
========================= */

function removeRow(i){

  rows.splice(i,1);

  if(rows.length===0){

    rows.push({
      item:"",
      category:"",
      qty:"",
      unit:"",
      rate:""
    });

  }

  render();

  saveData();

}


/* =========================
   UPDATE TOTAL
========================= */

function updateRowTotal(i){

  const el=document.getElementById(
    "rowTotal-"+i
  );

  if(el){

    el.textContent=money(
      num(rows[i].qty)*
      num(rows[i].rate)
    );

  }

}


/* =========================
   RECALCULATE
========================= */

function recalc(){

  let total=0;

  rows.forEach(row=>{

    total+=
      num(row.qty)*
      num(row.rate);

  });

  if(members<1)members=1;

  document.getElementById(
    "memberCount"
  ).textContent=money(members);

  document.getElementById(
    "totalCost"
  ).textContent=money(total);

  document.getElementById(
    "averageCost"
  ).textContent=money(
    total/members
  );

  document.getElementById(
    "grandTotal"
  ).textContent=money(total);

  saveData();

}


/* =========================
   FOCUS EXISTING CELL
========================= */

function focusCell(rowIndex,colIndex){

  const tr=document.querySelector(
    'tr[data-row-index="'+rowIndex+'"]'
  );

  if(!tr)return;

  const input=tr.querySelector(
    'input[data-col-index="'+colIndex+'"]'
  );

  activateInput(input);

}


/* =========================
   ENTER NAVIGATION
========================= */

function handleEnter(e,rowIndex,colIndex){

  if(
    e.key!=="Enter" &&
    e.key!=="Return"
  ){
    return;
  }

  e.preventDefault();
  e.stopPropagation();


  if(colIndex===0){

    focusCell(rowIndex,1);
    return;

  }


  if(colIndex===1){

    focusCell(rowIndex,2);
    return;

  }


  if(colIndex===2){

    focusCell(rowIndex,3);
    return;

  }


  if(colIndex===3){

    focusCell(rowIndex,4);
    return;

  }


  if(colIndex===4){

    if(rowIndex<rows.length-1){

      focusCell(rowIndex+1,0);

    }else{

      /*
        এখানে কোনো render() নেই।
        নতুন input সরাসরি DOM-এ তৈরি হচ্ছে
        এবং একই Enter event-এর মধ্যে focus হচ্ছে।
      */

      addRow();

    }

  }

}


/* =========================
   VIEW
========================= */

function showView(){

  document.getElementById("mainPage").style.display="none";
  document.getElementById("reportPage").style.display="none";
  document.getElementById("viewPage").style.display="block";

  renderView();

}

function renderView(){

  const body=document.getElementById(
    "viewBody"
  );

  body.innerHTML="";

  let total=0;

  const validRows=rows.filter(
    r=>
      String(r.item||"").trim()||
      num(r.qty)||
      num(r.rate)
  );

  if(validRows.length===0){

    const tr=document.createElement("tr");
    const td=document.createElement("td");

    td.colSpan=5;
    td.className="empty";
    td.textContent="কোনো Shopping List নেই";

    tr.appendChild(td);
    body.appendChild(tr);

  }else{

    validRows.forEach(r=>{

      const rowTotal=
        num(r.qty)*num(r.rate);

      total+=rowTotal;

      const tr=document.createElement("tr");

      [
        r.item||"",
        r.qty||"",
        r.unit||"",
        money(num(r.rate)),
        money(rowTotal)
      ].forEach(value=>{

        const td=document.createElement("td");

        td.textContent=value;

        tr.appendChild(td);

      });

      body.appendChild(tr);

    });

  }

  document.getElementById(
    "viewTotal"
  ).textContent=money(total);

}


/* =========================
   REPORT
========================= */

function showReport(){

  document.getElementById("mainPage").style.display="none";
  document.getElementById("viewPage").style.display="none";
  document.getElementById("reportPage").style.display="block";

  renderReport();

}

function renderReport(){

  const totals={};

  let grandTotal=0;

  rows.forEach(r=>{

    const amount=
      num(r.qty)*num(r.rate);

    if(amount<=0)return;

    let category=
      String(r.category||"").trim();

    if(!category)category="অন্যান্য";

    if(!totals[category]){
      totals[category]=0;
    }

    totals[category]+=amount;

    grandTotal+=amount;

  });

  const body=document.getElementById(
    "reportBody"
  );

  body.innerHTML="";

  const categories=
    Object.keys(totals)
      .sort((a,b)=>a.localeCompare(b,"bn"));

  if(categories.length===0){

    const tr=document.createElement("tr");
    const td=document.createElement("td");

    td.colSpan=2;
    td.className="empty";
    td.textContent="কোনো খরচের তথ্য নেই";

    tr.appendChild(td);
    body.appendChild(tr);

  }else{

    categories.forEach(category=>{

      const tr=document.createElement("tr");

      const tdName=document.createElement("td");
      tdName.textContent=category;

      const tdAmount=document.createElement("td");
      tdAmount.textContent=money(
        totals[category]
      );

      tr.appendChild(tdName);
      tr.appendChild(tdAmount);

      body.appendChild(tr);

    });

  }

  document.getElementById(
    "reportTotal"
  ).textContent=money(grandTotal);

}

   MAIN
========================= */

function showMain(){

  document.getElementById("viewPage").style.display="none";
  document.getElementById("reportPage").style.display="none";
  document.getElementById("mainPage").style.display="block";

  render();

}


/* =========================
   BACKUP
========================= */

function backupData(){

  const backup={
    app:"Shopping List",
    version:5,
    exportedAt:new Date().toISOString(),

    itemMaster:itemMaster,

    categoryMaster:categoryMaster,

    data:{
      members:members,
      rows:rows
    }
  };

  const blob=new Blob(
    [
      JSON.stringify(
        backup,
        null,
        2
      )
    ],
    {
      type:"application/json"
    }
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  const date=new Date()
    .toISOString()
    .slice(0,10);

  a.href=url;

  a.download=
    "Shopping-List-Backup-"+
    date+
    ".json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =========================
   RESTORE
========================= */

function restoreData(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const backup=
        JSON.parse(reader.result);

      if(
        !backup||
        !backup.data||
        !Array.isArray(backup.data.rows)
      ){

        alert("Backup file সঠিক নয়।");
        return;

      }

      rows=backup.data.rows.map(r=>({
        item:r.item||"",
        category:r.category||"",
        qty:r.qty||"",
        unit:r.unit||"",
        rate:r.rate||""
      }));

      if(rows.length===0){

        rows.push({
          item:"",
          category:"",
          qty:"",
          unit:"",
          rate:""
        });

      }

      members=
        Number(backup.data.members)||1;

      if(Array.isArray(backup.itemMaster)){
        itemMaster=backup.itemMaster;
      }

      if(Array.isArray(backup.categoryMaster)){
        categoryMaster=backup.categoryMaster;
      }

      categoryMaster=[
        ...new Set([
          ...categoryMaster,
          ...DEFAULT_CATEGORIES
        ])
      ];

      saveItems();
      saveCategories();
      saveData();
      render();

      alert(
        "Backup সফলভাবে Restore হয়েছে।"
      );

    }catch(e){

      alert(
        "Backup file পড়তে সমস্যা হয়েছে।"
      );

    }

  };

  reader.readAsText(file);

  event.target.value="";

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  const ok=confirm(
    "সব Shopping List, Item এবং Category-এর সংরক্ষিত ডাটা মুছে ফেলতে চান?"
  );

  if(!ok)return;

  rows=[{
    item:"",
    category:"",
    qty:"",
    unit:"",
    rate:""
  }];

  members=1;

  itemMaster=[];

  categoryMaster=[
    ...DEFAULT_CATEGORIES
  ];

  localStorage.removeItem(
    ITEMS_KEY
  );

  saveCategories();
  saveData();
  render();

}
