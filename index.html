<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="./manifest.json">

<title>Shopping List</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f7f6;
  color:#17312d;
  font-size:16px;
}

.page{
  max-width:900px;
  margin:auto;
  padding:14px;
}

h1{
  font-size:27px;
  margin:4px 0 16px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.summary-item{
  background:#e8f5f2;
  border-radius:10px;
  padding:11px;
  text-align:center;
}

.summary-item span{
  display:block;
  font-size:14px;
}

.summary-item strong{
  display:block;
  font-size:19px;
  margin-top:5px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  cursor:pointer;
  background:#0f766e;
  color:white;
  font-size:15px;
}

button.secondary{
  background:#64748b;
}

button.danger{
  background:#dc2626;
}

button.light{
  background:#e2e8f0;
  color:#17312d;
}

input{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:7px;
  padding:9px 8px;
  background:#fff;
  font-size:16px;
}

.people{
  max-width:180px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  border:1px solid #d8e2df;
  padding:9px 7px;
  text-align:left;
}

th{
  background:#e7f3f0;
  font-size:16px;
}

td{
  font-size:16px;
}

/* Main Shopping Table */

.main-table{
  width:100%;
  min-width:790px;
  table-layout:fixed;
}

/* Item */

.main-table th:nth-child(1),
.main-table td:nth-child(1){
  width:20%;
}

/* Category */

.main-table th:nth-child(2),
.main-table td:nth-child(2){
  width:16%;
}

/* Quantity */

.main-table th:nth-child(3),
.main-table td:nth-child(3){
  width:10%;
}

/* Unit */

.main-table th:nth-child(4),
.main-table td:nth-child(4){
  width:10%;
}

/* Rate */

.main-table th:nth-child(5),
.main-table td:nth-child(5){
  width:14%;
}

/* Total */

.main-table th:nth-child(6),
.main-table td:nth-child(6){
  width:17%;
}

/* Delete */

.main-table th:nth-child(7),
.main-table td:nth-child(7){
  width:9%;
  text-align:center;
}

.main-table input{
  width:100%;
  padding:9px 7px;
  font-size:16px;
}

.main-table td:nth-child(6){
  white-space:nowrap;
  font-weight:600;
}

.main-table td:last-child{
  text-align:center;
}

.remove{
  background:#dc2626;
  padding:7px 10px;
  font-size:15px;
}

.total-box{
  display:flex;
  justify-content:flex-end;
  margin-top:13px;
  font-size:21px;
  font-weight:bold;
}

/* View */

.view-page{
  display:none;
}

.view-header{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:13px;
}

.back{
  background:#475569;
}

.view-title{
  margin:0;
  font-size:24px;
}

.view-table{
  width:100%;
  min-width:0;
  table-layout:fixed;
}

.view-table th:nth-child(1),
.view-table td:nth-child(1){
  width:34%;
}

.view-table th:nth-child(2),
.view-table td:nth-child(2){
  width:16%;
}

.view-table th:nth-child(3),
.view-table td:nth-child(3){
  width:14%;
}

.view-table th:nth-child(4),
.view-table td:nth-child(4){
  width:17%;
}

.view-table th:nth-child(5),
.view-table td:nth-child(5){
  width:19%;
}

.view-table td,
.view-table th{
  padding:9px 6px;
  font-size:15px;
}

.view-table td:nth-child(n+2),
.view-table th:nth-child(n+2){
  white-space:nowrap;
}

.view-table td:first-child{
  overflow-wrap:anywhere;
}

/* Report */

.report-page{
  display:none;
}

.report-header{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:13px;
}

.report-title{
  margin:0;
  font-size:24px;
}

.report-table{
  width:100%;
  table-layout:fixed;
}

.report-table th:nth-child(1),
.report-table td:nth-child(1){
  width:60%;
}

.report-table th:nth-child(2),
.report-table td:nth-child(2){
  width:40%;
  text-align:right;
}

.report-table th,
.report-table td{
  font-size:16px;
  padding:11px 9px;
}

.report-table tfoot td{
  font-weight:bold;
  background:#e7f3f0;
}

.empty{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-size:16px;
}

@media(max-width:520px){

  .page{
    padding:10px;
  }

  h1{
    font-size:25px;
  }

  .card{
    padding:12px;
  }

  .summary{
    gap:6px;
  }

  .summary-item{
    padding:9px 5px;
  }

  .summary-item span{
    font-size:12px;
  }

  .summary-item strong{
    font-size:17px;
  }

  .actions button{
    flex:1 1 30%;
    padding:10px 7px;
    font-size:14px;
  }

  .main-table{
    min-width:790px;
  }

  .main-table th{
    font-size:15px;
    padding:9px 6px;
  }

  .main-table td{
    font-size:16px;
    padding:8px 5px;
  }

  .main-table input{
    font-size:16px;
    padding:9px 6px;
  }

  .view-title{
    font-size:21px;
  }

  .view-table th,
  .view-table td{
    font-size:15px;
    padding:9px 5px;
  }

  .report-title{
    font-size:21px;
  }

  .report-table th,
  .report-table td{
    font-size:15px;
    padding:10px 7px;
  }

  .total-box{
    font-size:20px;
  }

}

</style>
</head>

<body>

<div class="page">

  <!-- MAIN PAGE -->

  <div id="mainPage">

    <h1>Shopping List</h1>

    <div class="card">

      <div class="summary">

        <div class="summary-item">

          <span>Members / People</span>

          <strong>

            <input
              id="members"
              class="people"
              type="text"
              value="1"
              inputmode="numeric"
            >

          </strong>

        </div>


        <div class="summary-item">

          <span>Total Cost (৳)</span>

          <strong id="grandTotal">০</strong>

        </div>


        <div class="summary-item">

          <span>Average per Person (৳)</span>

          <strong id="average">০</strong>

        </div>

      </div>

    </div>


    <div class="card">

      <div class="actions">

        <button onclick="addRow()">
          + Add Item
        </button>

        <button onclick="showView()">
          View
        </button>

        <button onclick="showReport()">
          📊 Report
        </button>

        <button onclick="backupData()">
          Backup
        </button>

        <button onclick="document.getElementById('restoreFile').click()">
          Restore
        </button>

        <button class="danger" onclick="clearAll()">
          Clear
        </button>

      </div>


      <input
        type="file"
        id="restoreFile"
        accept=".json"
        style="display:none"
        onchange="restoreData(event)"
      >

    </div>


    <div class="card">

      <div class="table-wrap">

        <table class="main-table">

          <thead>

            <tr>

              <th>আইটেম</th>

              <th>ক্যাটাগরি</th>

              <th>পরিমাণ</th>

              <th>একক</th>

              <th>দর (৳)</th>

              <th>মোট (৳)</th>

              <th>বাদ দিন</th>

            </tr>

          </thead>

          <tbody id="tableBody"></tbody>

        </table>

      </div>


      <div class="total-box">

        সর্বমোট: ৳
        <span id="bottomTotal">০</span>

      </div>

    </div>

  </div>


  <!-- VIEW PAGE -->

  <div id="viewPage" class="view-page">

    <div class="card">

      <div class="view-header">

        <button class="back" onclick="hideView()">
          ← Back
        </button>

        <h2 class="view-title">
          Total Shopping List
        </h2>

      </div>


      <div class="table-wrap">

        <table class="view-table">

          <thead>

            <tr>

              <th>আইটেম</th>

              <th>পরিমাণ</th>

              <th>একক</th>

              <th>দর (৳)</th>

              <th>মোট (৳)</th>

            </tr>

          </thead>

          <tbody id="viewBody"></tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- REPORT PAGE -->

  <div id="reportPage" class="report-page">

    <div class="card">

      <div class="report-header">

        <button class="back" onclick="hideReport()">
          ← Back
        </button>

        <h2 class="report-title">
          খরচের ক্যাটাগরি রিপোর্ট
        </h2>

      </div>


      <div class="table-wrap">

        <table class="report-table">

          <thead>

            <tr>

              <th>ক্যাটাগরি</th>

              <th>মোট টাকা (৳)</th>

            </tr>

          </thead>

          <tbody id="reportBody"></tbody>

          <tfoot>

            <tr>

              <td>সর্বমোট</td>

              <td id="reportTotal">৳ ০</td>

            </tr>

          </tfoot>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- ITEM LIST -->


<!-- CATEGORY LIST -->

<datalist id="categoryList"></datalist>


<script>

/* =====================================================
   STORAGE
===================================================== */

const DATA_KEY =
  "shoppingListDataV2";

const ITEMS_KEY =
  "shoppingListItemsV3";

const CATEGORY_KEY =
  "shoppingListCategoriesV1";


/* =====================================================
   DEFAULT CATEGORY
===================================================== */

const DEFAULT_CATEGORIES = [
  "খাবার",
  "ডেকোরেটর",
  "অন্যান্য"
];


/* =====================================================
   LOAD
===================================================== */

let saved = loadData();

let itemMaster = loadItems();

let categoryMaster = loadCategories();

let rows = saved.rows;

let members = saved.members;


/* =====================================================
   NUMBER
===================================================== */

function normalizeNumber(v){

  return String(v ?? "")
    .replace(
      /[০-৯]/g,
      d => "০১২৩৪৫৬৭৮৯".indexOf(d)
    )
    .replace(
      /[٠-٩]/g,
      d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)
    )
    .replace(/,/g,"")
    .trim();

}


function num(v){

  let n =
    parseFloat(
      normalizeNumber(v)
    );

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(v){

  return Number(v || 0)
    .toLocaleString(
      "bn-BD",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* =====================================================
   SORT
===================================================== */

function sortItems(a){

  return [...a].sort(
    (x,y)=>
      String(x.name).localeCompare(
        String(y.name),
        "bn",
        {
          sensitivity:"base"
        }
      )
  );

}


function sortCategories(a){

  return [...a].sort(
    (x,y)=>
      String(x).localeCompare(
        String(y),
        "bn",
        {
          sensitivity:"base"
        }
      )
  );

}


/* =====================================================
   ITEM DATA
===================================================== */

function loadItems(){

  try{

    let x =
      JSON.parse(
        localStorage.getItem(
          ITEMS_KEY
        )
      );

    return Array.isArray(x)
      ? sortItems(
          x.filter(
            a=>a && a.name
          )
        )
      : [];

  }catch(e){

    return [];

  }

}


function saveItems(){

  itemMaster =
    sortItems(itemMaster);

  localStorage.setItem(
    ITEMS_KEY,
    JSON.stringify(itemMaster)
  );

}


/* =====================================================
   CATEGORY DATA
===================================================== */

function loadCategories(){

  try{

    let x =
      JSON.parse(
        localStorage.getItem(
          CATEGORY_KEY
        )
      );

    if(Array.isArray(x)){

      return [
        ...new Set(
          [
            ...DEFAULT_CATEGORIES,
            ...x
          ]
          .map(x=>String(x).trim())
          .filter(Boolean)
        )
      ];

    }

  }catch(e){}

  return [
    ...DEFAULT_CATEGORIES
  ];

}


function saveCategories(){

  categoryMaster =
    sortCategories(
      [
        ...new Set(
          categoryMaster
            .map(x=>String(x).trim())
            .filter(Boolean)
        )
      ]
    );

  localStorage.setItem(
    CATEGORY_KEY,
    JSON.stringify(
      categoryMaster
    )
  );

}


/* =====================================================
   MAIN DATA
===================================================== */

function loadData(){

  try{

    let x =
      JSON.parse(
        localStorage.getItem(
          DATA_KEY
        )
      );

    if(
      x &&
      Array.isArray(x.rows)
    ){

      return {
        members:
          x.members || 1,

        rows:
          x.rows
      };

    }

  }catch(e){}

  return {
    members:1,
    rows:[]
  };

}


function saveData(){

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify({

      version:4,

      members:
        num(members) || 1,

      rows

    })
  );

}


/* =====================================================
   ITEM LIST
===================================================== */

function updateList(){

  let d =
    document.getElementById(
      "itemList"
    );

  d.innerHTML = "";

  sortItems(
    itemMaster
  ).forEach(x=>{

    let o =
      document.createElement(
        "option"
      );

    o.value =
      x.name;

    d.appendChild(o);

  });

}


/* =====================================================
   CATEGORY LIST
===================================================== */

function updateCategoryList(){

  let d =
    document.getElementById(
      "categoryList"
    );

  d.innerHTML = "";

  sortCategories(
    categoryMaster
  ).forEach(x=>{

    let o =
      document.createElement(
        "option"
      );

    o.value = x;

    d.appendChild(o);

  });

}


/* =====================================================
   SAVE NEW ITEM
===================================================== */

function saveNewItem(i){

  let r = rows[i];

  let n =
    String(
      r.item || ""
    ).trim();

  if(!n)return;


  if(
    !itemMaster.some(
      x =>
        String(x.name)
          .trim()
          .toLowerCase()
        ===
        n.toLowerCase()
    )
  ){

    itemMaster.push({

      name:n,

      unit:
        String(
          r.unit || ""
        ).trim()

    });

    saveItems();

    updateList();

  }

}


/* =====================================================
   SAVE NEW CATEGORY
===================================================== */

function saveNewCategory(i){

  let r = rows[i];

  let n =
    String(
      r.category || ""
    ).trim();

  if(!n)return;


  if(
    !categoryMaster.some(
      x =>
        String(x)
          .trim()
          .toLowerCase()
        ===
        n.toLowerCase()
    )
  ){

    categoryMaster.push(n);

    saveCategories();

    updateCategoryList();

  }

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

  rows.push({

    item:"",
    category:"",
    qty:"",
    unit:"",
    rate:""

  });

  saveData();

  render();

  focusCell(
    rows.length - 1,
    0
  );

}


/* =====================================================
   REMOVE ROW
===================================================== */

function removeRow(i){

  rows.splice(
    i,
    1
  );

  saveData();

  render();

}


/* =====================================================
   ROW TOTAL
===================================================== */

function updateRowTotal(i){

  let cell =
    document.getElementById(
      "rowTotal-" + i
    );

  if(cell){

    cell.textContent =
      "৳ " +
      money(
        num(rows[i].qty) *
        num(rows[i].rate)
      );

  }

}


/* =====================================================
   RECALCULATE
===================================================== */

function recalc(){

  let total =
    rows.reduce(
      (s,r)=>
        s +
        num(r.qty) *
        num(r.rate),
      0
    );


  document.getElementById(
    "grandTotal"
  ).textContent =
    money(total);


  document.getElementById(
    "bottomTotal"
  ).textContent =
    money(total);


  document.getElementById(
    "average"
  ).textContent =
    money(
      total /
      (num(members) || 1)
    );

}


/* =====================================================
   FOCUS CELL
===================================================== */

function focusCell(
  rowIndex,
  colIndex
){

  setTimeout(()=>{

    let row =
      document.querySelector(
        '#tableBody tr[data-row-index="' +
        rowIndex +
        '"]'
      );

    if(!row)return;


    let input =
      row.querySelector(
        'input[data-col-index="' +
        colIndex +
        '"]'
      );


    if(input){

      input.focus();

      input.select();

    }

  },50);

}


/* =====================================================
   ENTER NAVIGATION

   0 Item
   1 Category
   2 Quantity
   3 Unit
   4 Rate

===================================================== */

function handleEnter(
  e,
  rowIndex,
  colIndex
){

  /*
    iPhone-এর Return key
    এবং keyboard-এর Enter key
    দুটোই key = Enter হিসেবে
    ধরা হবে।
  */

  if(
    e.key !== "Enter" &&
    e.key !== "Return"
  ){
    return;
  }


  e.preventDefault();

  e.stopPropagation();


  if(colIndex < 4){

    focusCell(
      rowIndex,
      colIndex + 1
    );

  }else{

    if(
      rowIndex ===
      rows.length - 1
    ){

      rows.push({

        item:"",
        category:"",
        qty:"",
        unit:"",
        rate:""

      });

      saveData();

      render();

      focusCell(
        rows.length - 1,
        0
      );

    }else{

      focusCell(
        rowIndex + 1,
        0
      );

    }

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(v){

  return String(v ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  let body =
    document.getElementById(
      "tableBody"
    );

  body.innerHTML = "";


  rows.forEach(
    (r,i)=>{

      if(!r.category){
        r.category = "";
      }


      let tr =
        document.createElement(
          "tr"
        );

      tr.dataset.rowIndex = i;


      /* ITEM */

      let tdItem =
        document.createElement(
          "td"
        );


      let itemInput =
        document.createElement(
          "input"
        );


      itemInput.type =
        "text";

      itemInput.setAttribute(
        "list",
        "itemList"
      );

      itemInput.dataset.colIndex =
        "0";

      itemInput.value =
        r.item || "";


      itemInput.addEventListener(
        "input",
        e=>{

          rows[i].item =
            e.target.value;

          saveData();

        }
      );


      itemInput.addEventListener(
        "change",
        ()=>{
          saveNewItem(i);
        }
      );


      itemInput.addEventListener(
        "keydown",
        e=>{
          handleEnter(
            e,
            i,
            0
          );
        }
      );


      tdItem.appendChild(
        itemInput
      );


      /* CATEGORY */

      let tdCategory =
        document.createElement(
          "td"
        );


      let categoryInput =
        document.createElement(
          "input"
        );


      categoryInput.type =
        "text";

      categoryInput.setAttribute(
        "list",
        "categoryList"
      );

      categoryInput.dataset.colIndex =
        "1";

      categoryInput.value =
        r.category || "";


      categoryInput.addEventListener(
        "input",
        e=>{

          rows[i].category =
            e.target.value;

          saveData();

          recalc();

        }
      );


      categoryInput.addEventListener(
        "change",
        ()=>{
          saveNewCategory(i);
        }
      );


      categoryInput.addEventListener(
        "blur",
        ()=>{
          saveNewCategory(i);
        }
      );


      categoryInput.addEventListener(
        "keydown",
        e=>{
          handleEnter(
            e,
            i,
            1
          );
        }
      );


      tdCategory.appendChild(
        categoryInput
      );


      /* QUANTITY */

      let tdQty =
        document.createElement(
          "td"
        );


      let qtyInput =
        document.createElement(
          "input"
        );


      /*
        এখানে inputMode ব্যবহার করা হয়নি।

        তাই iPhone-এ সাধারণ keyboard
        আসবে এবং Return button থাকবে।
      */

      qtyInput.type =
        "text";

      qtyInput.dataset.colIndex =
        "2";

      qtyInput.value =
        r.qty || "";


      qtyInput.addEventListener(
        "input",
        e=>{

          rows[i].qty =
            e.target.value;

          saveData();

          updateRowTotal(i);

          recalc();

        }
      );


      qtyInput.addEventListener(
        "keydown",
        e=>{
          handleEnter(
            e,
            i,
            2
          );
        }
      );


      tdQty.appendChild(
        qtyInput
      );


      /* UNIT */

      let tdUnit =
        document.createElement(
          "td"
        );


      let unitInput =
        document.createElement(
          "input"
        );


      unitInput.type =
        "text";

      unitInput.dataset.colIndex =
        "3";

      unitInput.value =
        r.unit || "";


      unitInput.addEventListener(
        "input",
        e=>{

          rows[i].unit =
            e.target.value;

          saveData();

        }
      );


      unitInput.addEventListener(
        "keydown",
        e=>{
          handleEnter(
            e,
            i,
            3
          );
        }
      );


      tdUnit.appendChild(
        unitInput
      );


      /* RATE */

      let tdRate =
        document.createElement(
          "td"
        );


      let rateInput =
        document.createElement(
          "input"
        );


      /*
        inputMode নেই।

        তাই iPhone-এ Return
        button থাকবে।
      */

      rateInput.type =
        "text";

      rateInput.dataset.colIndex =
        "4";

      rateInput.value =
        r.rate || "";


      rateInput.addEventListener(
        "input",
        e=>{

          rows[i].rate =
            e.target.value;

          saveData();

          updateRowTotal(i);

          recalc();

        }
      );


      rateInput.addEventListener(
        "keydown",
        e=>{
          handleEnter(
            e,
            i,
            4
          );
        }
      );


      tdRate.appendChild(
        rateInput
      );


      /* TOTAL */

      let tdTotal =
        document.createElement(
          "td"
        );


      tdTotal.id =
        "rowTotal-" + i;


      tdTotal.textContent =
        "৳ " +
        money(
          num(r.qty) *
          num(r.rate)
        );


      /* DELETE */

      let tdDelete =
        document.createElement(
          "td"
        );


      let deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "remove";

      deleteButton.textContent =
        "×";

      deleteButton.title =
        "এই আইটেম বাদ দিন";


      deleteButton.onclick =
        ()=>{
          removeRow(i);
        };


      tdDelete.appendChild(
        deleteButton
      );


      tr.appendChild(
        tdItem
      );

      tr.appendChild(
        tdCategory
      );

      tr.appendChild(
        tdQty
      );

      tr.appendChild(
        tdUnit
      );

      tr.appendChild(
        tdRate
      );

      tr.appendChild(
        tdTotal
      );

      tr.appendChild(
        tdDelete
      );


      body.appendChild(
        tr
      );

    }
  );


  updateList();

  updateCategoryList();

  recalc();

}

/* =====================================================
   VIEW
===================================================== */

function showView(){

  document.getElementById(
    "mainPage"
  ).style.display =
    "none";


  document.getElementById(
    "reportPage"
  ).style.display =
    "none";


  document.getElementById(
    "viewPage"
  ).style.display =
    "block";


  let body =
    document.getElementById(
      "viewBody"
    );

  body.innerHTML = "";


  let hasRows = false;


  rows.forEach(
    r=>{

      if(
        !String(
          r.item || ""
        ).trim()
        &&
        !num(r.qty)
        &&
        !num(r.rate)
      ){

        return;

      }


      hasRows = true;


      let tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>
          ${esc(r.item)}
        </td>

        <td>
          ${esc(r.qty)}
        </td>

        <td>
          ${esc(r.unit)}
        </td>

        <td>
          ৳ ${money(num(r.rate))}
        </td>

        <td>
          ৳ ${
            money(
              num(r.qty) *
              num(r.rate)
            )
          }
        </td>

      `;


      body.appendChild(
        tr
      );

    }
  );


  if(!hasRows){

    body.innerHTML =
      `
      <tr>
        <td
          colspan="5"
          class="empty"
        >
          কোনো তথ্য নেই

      </tr>

}


function hideView(){

    "viewPage"
  ).style.display =
    "none";


  document.getElementById(
    "mainPage"
  ).style.display =
    "block";

}


/* =====================================================
   REPORT
===================================================== */

function showReport(){

  document.getElementById(
    "mainPage"
  ).style.display =
    "none";


  document.getElementById(
    "viewPage"
  ).style.display =
    "none";


  document.getElementById(
    "reportPage"
  ).style.display =
    "block";


  let totals = {};


  rows.forEach(
    r=>{

      let category =
        String(
          r.category || ""
        ).trim();


      let total =
        num(r.qty) *
        num(r.rate);


      if(
        !category ||
        total === 0
      ){

        return;

      }


      if(
        !Object.prototype.hasOwnProperty.call(
          totals,
          category
        )
      ){

        totals[category] = 0;

      }


      totals[category] +=
        total;

    }
  );


  let body =
    document.getElementById(
      "reportBody"
    );

  body.innerHTML = "";


  let grand = 0;


  let categories =
    Object.keys(totals)
      .sort(
        (a,b)=>
          a.localeCompare(
            b,
            "bn",
            {
              sensitivity:"base"
            }
          )
      );


  if(
    categories.length === 0
  ){

    body.innerHTML =
      `
      <tr>
        <td
          colspan="2"
          class="empty"
        >
          কোনো ক্যাটাগরি অনুযায়ী হিসাব পাওয়া যায়নি
        </td>
      </tr>
      `;

  }else{

    categories.forEach(
      category=>{

        grand +=
          totals[category];


        let tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML = `

          <td>
            ${esc(category)}
          </td>

          <td>
            ৳ ${
              money(
                totals[category]
              )
            }
          </td>

        `;


        body.appendChild(
          tr
        );

      }
    );

  }


  document.getElementById(
    "reportTotal"
  ).textContent =
    "৳ " +
    money(grand);

}


function hideReport(){

  document.getElementById(
    "reportPage"
  ).style.display =
    "none";


  document.getElementById(
    "mainPage"
  ).style.display =
    "block";

}

===================================================== */

function clearAll(){

  let ok =

      "সব Shopping List, Item এবং Category-এর সংরক্ষিত ডাটা মুছে ফেলতে চান?"
    );

  rows = [];

  members = 1;

  itemMaster = [];

  categoryMaster = [];

  ).value =

    ITEMS_KEY
  );


  localStorage.removeItem(
    CATEGORY_KEY
  );


  saveData();

  render();

}


/* =====================================================
   BACKUP
===================================================== */

function backupData(){

  let backup = {

    app:
      "Shopping List",

    version:
      4,

    exportedAt:
      new Date().toISOString(),

    itemMaster:
      itemMaster,

    categoryMaster:
      categoryMaster,

    data:{

      members:
        members,

      rows:
        rows

    }

  };


  let blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  let url =
    URL.createObjectURL(
      blob
    );


  let a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download =
    "shopping-list-backup.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );

}


/* =====================================================
   RESTORE
===================================================== */

function restoreData(event){

  let file =
    event.target.files[0];


  if(!file)return;


  let reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        let backup =
          JSON.parse(
            e.target.result
          );


        if(
          !backup ||
          !backup.data ||
          !Array.isArray(
            backup.data.rows
          )
        ){

          alert(
            "Backup ফাইলটি সঠিক নয়।"
          );

          return;

        }


        rows =
          backup.data.rows.map(
            r=>({

              item:
                r.item || "",

              category:
                r.category || "",

              qty:
                r.qty || "",

              unit:
                r.unit || "",

              rate:
                r.rate || ""

            })
          );


        members =
          num(
            backup.data.members
          ) || 1;


        if(
          Array.isArray(
            backup.itemMaster
          )
        ){

          itemMaster =
            backup.itemMaster;

        }else{

          itemMaster = [];

        }


        if(
          Array.isArray(
            backup.categoryMaster
          )
        ){

          categoryMaster =
            backup.categoryMaster;

        }else{

          categoryMaster =
            [
              ...DEFAULT_CATEGORIES
            ];

        }


        saveItems();

        saveCategories();

        saveData();


        document.getElementById(
          "members"
        ).value =
          members;


        render();


        alert(
          "Backup সফলভাবে Restore হয়েছে।"
        );


      }catch(error){

        alert(
          "Backup ফাইল পড়তে সমস্যা হয়েছে।"
        );

      }

    };


  reader.readAsText(file);


  event.target.value = "";

}
